# JEBYUS-0061: GitHub Pages serves the repository root straight from the branch (no deploy workflow here),
# so this only checks pull requests and main: every published file must equal what _src builds.
name: drift
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Root equals the build (fails and names the files that differ)
        run: python _src/build.py --check
